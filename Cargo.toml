[package]
name = "floatdea"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["accesskit", "wayland", "wgpu", "x11"] }
egui = { version = "0.35.0", default-features = false }
egui_extras = { version = "0.35.0", features = ["svg"] }
egui_commonmark = { version = "0.24", default-features = false, features = ["pulldown_cmark"] }
epaint_default_fonts = "0.35.0"
env_logger = "0.11.11"
log = "0.4.33"
mathjax-svg-rs = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
system-fonts = "0.1.2"
ulid = "1.2"

# AI provider layer (see plan_ai.md §9): genai 0.6.x is the single LLM access
# library; FloatDea owns conversations, turn tasks and cancellation.
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
genai = "=0.6.5"
tokio = { version = "1.47", features = ["rt-multi-thread", "sync", "time", "macros"] }

[profile.optimized]
inherits = "release"
lto = true
incremental = false
codegen-units = 1
debug = false

[profile.release]
debug = "full"
