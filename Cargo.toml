[package]
name = "floatdea"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.35.0"
egui = "0.35.0"
egui_extras = "0.35.0"
env_logger = "0.11.11"
log = "0.4.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ulid = "1.2"

[profile.optimized]
inherits = "release"
lto = true
incremental = false
codegen-units = 1

[profile.release]
debug = "full"
